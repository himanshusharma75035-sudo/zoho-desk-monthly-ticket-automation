<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Zoho Desk Automation System Overview</title>
  <desc id="desc">A flow from scheduler to runner to Python automation to Zoho Desk, state, logs, and Telegram.</desc>
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .api { fill: #ecfeff; stroke: #0e7490; stroke-width: 2; rx: 12; }
      .store { fill: #fefce8; stroke: #a16207; stroke-width: 2; rx: 12; }
      .text { font: 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>
  <rect class="box" x="30" y="60" width="145" height="72"/>
  <text class="text" x="52" y="91">Task Scheduler</text>
  <text class="small" x="54" y="112">monthly triggers</text>

  <rect class="box" x="225" y="60" width="145" height="72"/>
  <text class="text" x="255" y="91">PowerShell</text>
  <text class="small" x="252" y="112">runner + logs</text>

  <rect class="box" x="420" y="60" width="155" height="72"/>
  <text class="text" x="452" y="91">Python Core</text>
  <text class="small" x="448" y="112">render + dedupe</text>

  <rect class="api" x="635" y="35" width="145" height="72"/>
  <text class="text" x="670" y="66">Zoho Desk</text>
  <text class="small" x="666" y="87">create tickets</text>

  <rect class="api" x="635" y="135" width="145" height="72"/>
  <text class="text" x="670" y="166">Telegram</text>
  <text class="small" x="658" y="187">send summary</text>

  <rect class="store" x="420" y="230" width="155" height="72"/>
  <text class="text" x="459" y="260">State File</text>
  <text class="small" x="440" y="281">duplicate guard</text>

  <path class="arrow" d="M175 96 H225"/>
  <path class="arrow" d="M370 96 H420"/>
  <path class="arrow" d="M575 91 C600 80 610 72 635 71"/>
  <path class="arrow" d="M575 111 C603 132 607 164 635 171"/>
  <path class="arrow" d="M498 132 V230"/>
  <path class="arrow" d="M575 266 C620 252 660 224 684 207"/>
</svg>

